<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAG Interactive Wallpaper</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#050814;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#clock{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 9vh);text-align:center;color:#fff;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.35)}
#time{font-size:min(22vw,96px);font-weight:200;letter-spacing:.02em;line-height:1}
#date{margin-top:8px;font-size:15px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;font-weight:400}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,0);max-width:80vw;text-align:center;color:#fff;font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:10px 16px;border-radius:14px;background:rgba(10,12,30,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,-10px)}
#gear{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,30,.3);color:#fff;font-size:18px;opacity:.45;backdrop-filter:blur(6px)}
#panel{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:16px;border-radius:20px;background:rgba(12,14,34,.82);backdrop-filter:blur(14px);color:#fff;border:1px solid rgba(255,255,255,.2);display:none;font-size:14px}
#panel.on{display:block}
#panel h4{margin:10px 0 6px;font-weight:500;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13px}
.chip.sel{background:rgba(255,255,255,.9);color:#111}
#panel input{width:46px;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-align:center}
.sch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px}
</style></head><body>
<canvas id="c"></canvas>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<div id="toast"></div>
<button id="gear" aria-label="Settings">⚙</button>
<div id="panel">
 <h4>Mode</h4><div class="row"><button class="chip" id="mAuto">Auto</button><button class="chip" id="mMan">Manual</button></div>
 <h4>Environment</h4><div class="row" id="themes"></div>
 <h4>Schedule (hour 0–23)</h4><div class="sch" id="sch"></div>
 <div class="row" style="margin-top:12px"><button class="chip" id="resume">Resume Auto</button><button class="chip" id="close">Close</button></div>
</div>
<script>
(function(){
window.onerror=function(m,u,l){var d=document.getElementById('date');if(d)d.textContent='ERR: '+m+' @'+l};const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const R=Math.random,TAU=Math.PI*2;
const T={
 forest:{n:'Forest',sky:['#10331f','#3f7a3a','#e9c46a'],pc:['#ffe9a8','#fff7d1','#b8f27b'],msgs:['A FIREFLY SAYS HI','404: PATIENCE NOT FOUND','MOSS.exe RUNNING SLOWLY','SOMEWHERE IN THE UNIVERSE...','TREE COMPILED SUCCESSFULLY','OWNER: AAG','SPORES LOADING...','DEVELOPER IS BUSY']},
 meadow:{n:'Meadow',sky:['#4aa8ff','#9ad7ff','#d9f5c4'],pc:['#fff3b0','#ffc2d9','#ffffff'],msgs:['BLOOM STATUS: STILL FABULOUS','BUG DETECTED: TOO MUCH CREATIVITY','POLLEN COUNT: MAGICAL','PLEASE WAIT. MAGIC IN PROGRESS.','OWNER: AAG','COFFEE.exe NOT FOUND','BUTTERFLY EFFECT ENABLED','REALITY LOADING...']},
 beach:{n:'Beach',sky:['#6b4fa0','#ff8f6b','#ffd29a'],pc:['#ffffff','#bfefff','#ffe3a8'],msgs:['MESSAGE IN A SHELL','SYSTEM OVERTHINKING...','TIDE.exe PENDING','SANDBOX MODE: ON','SOMEWHERE IN THE UNIVERSE...','OWNER: AAG','CRAB SAYS: SIDEWAYS DEPLOY','BUILD STATUS: STILL FABULOUS']},
 space:{n:'Space',sky:['#02030c','#0b1236','#2a1a5e'],pc:['#ffffff','#b9a8ff','#8fe7ff'],msgs:['404: PATIENCE NOT FOUND','DEVELOPER IS BUSY','SYSTEM OVERTHINKING...','COFFEE.exe NOT FOUND','REALITY LOADING...','OWNER: AAG','SOMEWHERE IN THE UNIVERSE...','ASTRONAUT.exe LOST IN SPACE']}
};
const ORDER=['forest','meadow','beach','space'];
let sch={forest:6,meadow:11,beach:16,space:19},mode='auto',manual='forest';
try{const s=JSON.parse(localStorage.getItem('aag')||'{}');if(s.sch)sch=s.sch;if(s.mode)mode=s.mode;if(s.manual)manual=s.manual}catch(e){}
function save(){try{localStorage.setItem('aag',JSON.stringify({sch,mode,manual}))}catch(e){}}
function autoTheme(h){if(h>=sch.space||h<sch.forest)return 'space';if(h>=sch.beach)return 'beach';if(h>=sch.meadow)return 'meadow';return 'forest'}
let cur=mode==='auto'?autoTheme(new Date().getHours()):manual,prev=null,fade=1;
function setTheme(n){if(n===cur)return;prev=cur;cur=n;fade=0}
/* objects */
let objs={};
function mk(k,x,y,extra){return Object.assign({k,x,y,hx:x,hy:y,ph:R()*TAU,t:-1,s:.8+R()*.5,vx:0,vy:0,rot:0},extra||{})}
function layout(){
 const w=W,h=H,y=(a,b)=>h*(a+R()*(b-a)),x=()=>w*(.08+R()*.84);
 objs.forest=[];for(let i=0;i<7;i++)objs.forest.push(mk('firefly',x(),y(.3,.85)));
 for(let i=0;i<3;i++)objs.forest.push(mk('mushroom',w*(.15+i*.35+R()*.1),h*(.86+R()*.05)));
 for(let i=0;i<4;i++)objs.forest.push(mk('leaf',x(),y(.35,.8)));
 objs.meadow=[];for(let i=0;i<6;i++)objs.meadow.push(mk('flower',w*(.1+i*.15),h*(.8+R()*.12),{col:['#ff6f91','#ffd166','#c77dff','#ffffff','#ff9f1c'][i%5]}));
 for(let i=0;i<3;i++)objs.meadow.push(mk('butterfly',x(),y(.32,.7)));
 for(let i=0;i<6;i++)objs.meadow.push(mk('pollen',x(),y(.3,.8)));
 objs.beach=[];for(let i=0;i<3;i++)objs.beach.push(mk('shell',x(),h*(.82+R()*.12)));
 for(let i=0;i<2;i++)objs.beach.push(mk('crab',x(),h*(.88+R()*.06)));
 for(let i=0;i<5;i++)objs.beach.push(mk('bubble',x(),y(.55,.8)));
 objs.space=[];for(let i=0;i<10;i++)objs.space.push(mk('star',x(),y(.3,.9)));
 objs.space.push(mk('planet',w*.78,h*.58,{r:w*.11,col:['#ff9a62','#c24d2c'],ring:1}));
 objs.space.push(mk('planet',w*.2,h*.76,{r:w*.07,col:['#7fd7ff','#2b6cb0'],ring:0}));objs.space.push(mk('planet',w*.62,h*.92,{r:w*.04,col:['#e6d3ff','#7a5ac0'],ring:0}));objs.space.push(mk('astro',w*.5,h*.64,{s:1.3}));
}
function resize(){W=innerWidth||screen.width;H=innerHeight||screen.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();bg={};}
/* particles */
let P=[],ripples=[],trail=[];
function emit(x,y,n,sp,th,opt){const pc=T[th||cur].pc;for(let i=0;i<n&&P.length<420;i++){const a=R()*TAU,v=R()*sp;P.push(Object.assign({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0,m:.7+R()*.9,c:pc[(R()*pc.length)|0],s:1+R()*2.4},opt))}}
/* messages */
let toastT=0;const toast=document.getElementById('toast');
function say(txt){const now=performance.now();if(now-toastT<1800)return;toastT=now;toast.textContent=txt;toast.classList.add('on');clearTimeout(say.h);say.h=setTimeout(()=>toast.classList.remove('on'),2300)}
function msg(){const l=T[cur].msgs;say(l[(R()*l.length)|0])}
/* tap reactions */
function react(o){
 o.t=0;emit(o.x,o.y,18,90);
 if(o.k==='leaf'){o.vy=-60;o.vx=40*(R()-.5)}
 if(o.k==='butterfly'){o.vx=160;o.vy=-140}
 if(o.k==='crab'){o.vx=(R()<.5?-1:1)*90}
 if(o.k==='bubble'||o.k==='shell'||o.k==='planet')ripples.push({x:o.x,y:o.y,r:6,a:1,c:'#ffffff'});
 if(R()<.75)msg();
}
/* background gradient cache */
let bg={};
function grad(n){const s=T[n].sky,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,s[0]);g.addColorStop(.55,s[1]);g.addColorStop(1,s[2]);return g}
function scene(n,a,t){
 ctx.globalAlpha=a;
 ctx.fillStyle=bg[n]||(bg[n]=grad(n));ctx.fillRect(0,0,W,H);
 const f=SCENE[n];f(t);
 for(const o of objs[n])drawObj(o,t,n);
 ctx.globalAlpha=1;
}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(255,255,255,0)');const pa=ctx.globalAlpha;ctx.globalAlpha=pa*a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=pa}
function hill(y,amp,c,t,sw){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=12)ctx.lineTo(x,y+Math.sin(x*sw+t*.0)*amp);ctx.lineTo(W,H);ctx.fill()}
function tree(x,base,h,w,t){ctx.fillStyle='#1d140c';ctx.fillRect(x-w/2,base-h,w,h);ctx.strokeStyle='#1d140c';ctx.lineWidth=w*.35;ctx.beginPath();ctx.moveTo(x,base-h*.5);ctx.lineTo(x-w*1.4,base-h*.8);ctx.moveTo(x,base-h*.35);ctx.lineTo(x+w*1.5,base-h*.65);ctx.moveTo(x-w/2,base);ctx.lineTo(x-w*1.2,base+2);ctx.moveTo(x+w/2,base);ctx.lineTo(x+w*1.2,base+2);ctx.stroke();const sw=Math.sin(t*.8+x)*4;
 for(const [dx,dy,r,c] of [[0,-h*1.1,w*2.6,'#17481f'],[-w*1.6,-h*.85,w*2,'#1f5a2b'],[w*1.7,-h*.88,w*1.9,'#1f5a2b'],[-w*.8,-h*1.02,w*1.9,'#2b7a38'],[w*.9,-h*1.05,w*1.8,'#2f8a3d'],[0,-h*1.28,w*1.5,'#3a9a47'],[-w*1.9,-h*.65,w*1.2,'#2f8a3d'],[w*2,-h*.68,w*1.1,'#3a9a47']]){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+dx+sw,base+dy,r,0,TAU);ctx.fill()}}
const SCENE={
 forest(t){
  ctx.save();ctx.fillStyle='rgba(255,230,150,.16)';for(let i=0;i<5;i++){const x0=W*(.55+i*.12),sw=Math.sin(t*.4+i)*14;ctx.beginPath();ctx.moveTo(W*.8+i*6,-10);ctx.lineTo(x0-60+sw,H);ctx.lineTo(x0+10+sw,H);ctx.closePath();ctx.fill()}ctx.restore();
  glow(W*.82,0,W*.7,'rgba(255,220,120,.55)',1);
  hill(H*.78,14,'#1c4a2a',t,.01);
  tree(W*.1,H*.9,H*.45,W*.05,t);tree(W*.92,H*.9,H*.4,W*.045,t);tree(W*.5,H*.8,H*.2,W*.025,t);
  hill(H*.9,8,'#12301c',t,.02);ctx.strokeStyle='#2f8a3d';ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<16;i++){const x=i*W/15+((i*29)%20),s=Math.sin(t*1.2+i)*5;for(let j=-1;j<=1;j++){ctx.moveTo(x,H);ctx.quadraticCurveTo(x+j*8,H-24,x+j*22+s,H-44-(i%3)*8)}}ctx.stroke();
  for(let i=0;i<10;i++){const x=(i*W/9+t*6)%W,y=H*.3+((i*97+t*14)%(H*.5));glow(x,y,3,'#ffe9a8',.6)}
 },
 meadow(t){
  glow(W*.8,H*.18,W*.5,'rgba(255,255,220,.9)',1);
  ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<4;i++){const x=((t*8+i*W*.4)%(W*1.4))-W*.2,y=H*(.34+i*.07);for(const [dx,r] of [[0,26],[26,34],[56,24]]){ctx.beginPath();ctx.ellipse(x+dx,y,r*1.4,r*.7,0,0,TAU);ctx.fill()}}
  hill(H*.74,18,'#6cc76a',t,.012);hill(H*.82,14,'#4fae52',t,.02);
  ctx.strokeStyle='#2f8f3a';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<W;x+=9){const y=H*.84+((x*13)%40);ctx.moveTo(x,y+30);ctx.lineTo(x+Math.sin(t*1.6+x*.05)*6,y)}ctx.stroke();
 },
 beach(t){
  glow(W*.5,H*.42,W*.8,'rgba(255,200,120,.75)',1);
  ctx.fillStyle='#fff1c4';ctx.beginPath();ctx.arc(W*.5,H*.42,W*.12,0,TAU);ctx.fill();
  const sy=H*.5;let g=ctx.createLinearGradient(0,sy,0,H*.78);g.addColorStop(0,'#ff9d8a');g.addColorStop(1,'#1fb5b5');ctx.fillStyle=g;ctx.fillRect(0,sy,W,H*.3);
  for(let i=0;i<26;i++){const x=(i*W/25+Math.sin(t+i)*12),y=sy+((i*37)%(H*.27));ctx.fillStyle='rgba(255,255,255,'+(.3+.4*Math.sin(t*3+i*2))+')';ctx.fillRect(x,y,2.5,2.5)}
  glow(W*.5,sy+H*.08,W*.32,'rgba(255,220,150,.55)',.9);for(let k=0;k<4;k++){const by=H*(.62+k*.036),amp=4+k*2.5,ph=t*(.9+k*.15)+k*2,wy=x=>by+Math.sin(x*.025+ph)*amp+Math.sin(x*.07-ph)*2;ctx.fillStyle='rgba('+(20+k*30)+','+(170+k*18)+','+(185+k*10)+','+(.28+k*.08)+')';ctx.beginPath();ctx.moveTo(0,H*.8);for(let x=0;x<=W;x+=10)ctx.lineTo(x,wy(x));ctx.lineTo(W,H*.8);ctx.fill();ctx.strokeStyle='rgba(255,255,255,'+(.3+k*.12)+')';ctx.lineWidth=1.4+k*.6;ctx.beginPath();for(let x=0;x<=W;x+=10)x?ctx.lineTo(x,wy(x)):ctx.moveTo(x,wy(x));ctx.stroke()}
  ctx.fillStyle='#f2c98a';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=12)ctx.lineTo(x,H*.78+Math.sin(x*.01)*14+x*.02);ctx.lineTo(W,H);ctx.fill();
  const palm=(x,b,h,d)=>{ctx.strokeStyle='#5a3a22';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x,b);ctx.quadraticCurveTo(x+d*.5,b-h*.6,x+d,b-h);ctx.stroke();ctx.strokeStyle='#1f7a4a';ctx.lineWidth=5;for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.55+Math.sin(t+i)*.05;ctx.beginPath();ctx.moveTo(x+d,b-h);ctx.quadraticCurveTo(x+d+Math.cos(a)*50,b-h+Math.sin(a)*40-20,x+d+Math.cos(a)*90,b-h+Math.sin(a)*70+20);ctx.stroke()}};
  {const wash=Math.sin(t*.6)*9;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=10){const y=H*.78+Math.sin(x*.01)*14+x*.02+6+wash+Math.sin(x*.06+t*2)*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.fillStyle='rgba(120,80,40,.12)';ctx.fillRect(0,H*.8+wash,W,6)}palm(W*.1,H*.92,H*.38,W*.1);palm(W*.92,H*.9,H*.3,-W*.1);
 },
 space(t){
  glow(W*.25,H*.3,W*.7,'rgba(120,60,200,.35)',1);glow(W*.8,H*.75,W*.6,'rgba(30,120,200,.3)',1);
  for(let i=0;i<90;i++){const x=(i*73.7)%W,y=(i*131.3)%H;ctx.fillStyle='rgba(255,255,255,'+(.35+.5*Math.sin(t*1.5+i))+')';ctx.fillRect(x,y,i%7?1.2:2,i%7?1.2:2)}
  const k=(t*.25)%6;if(k<1){const x=W*(1-k*.9),y=H*.12+k*H*.3;const g=ctx.createLinearGradient(x,y,x+90,y-45);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+90,y-45);ctx.stroke()}
  ctx.save();ctx.translate(W*.3,H*.45);ctx.rotate(t*.03);ctx.scale(1,.45);for(let i=0;i<220;i++){const a=i*.22,r=i*.7+4,arm=i%2?Math.PI:0;ctx.fillStyle='rgba('+(i%3?'190,170,255':'255,220,200')+','+(.75-i/330)+')';ctx.fillRect(Math.cos(a+arm)*r,Math.sin(a+arm)*r,1.6,1.6)}ctx.restore();glow(W*.3,H*.45,26,'rgba(255,240,220,.8)',.8);ctx.fillStyle='#6a6a7a';for(let i=0;i<14;i++){const a=t*.05+i*.45,x=W*.5+Math.cos(a)*W*.55,y=H*.2+Math.sin(a)*H*.07+i*3;ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,TAU);ctx.fill()}
 }
};
function drawObj(o,t,n){
 const dt=o.t>=0?o.t:-1;let x=o.x,y=o.y;const k=o.k;
 ctx.save();
 if(k==='firefly'){x+=Math.sin(t*.7+o.ph)*18;y+=Math.cos(t*.9+o.ph)*14;o.x=o.hx+(x-o.hx);const p=.5+.5*Math.sin(t*2+o.ph)+(dt>=0&&dt<2?1-dt/2:0);glow(x,y,16+8*p,'rgba(230,255,140,.9)',Math.min(1,.4+p*.5));ctx.fillStyle='#fffbd0';ctx.beginPath();ctx.arc(x,y,2.5,0,TAU);ctx.fill();o.cx=x;o.cy=y}
 else if(k==='mushroom'){const s=o.s*(dt>=0&&dt<.6?1+.25*Math.sin(dt*Math.PI/.6):1)*1.2;ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#f4e8d0';ctx.fillRect(-5,-14,10,14);ctx.fillStyle='#d6453d';ctx.beginPath();ctx.arc(0,-14,17,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';for(const [a,b] of [[-7,-20],[5,-23],[9,-15]]){ctx.beginPath();ctx.arc(a,b,2.5,0,TAU);ctx.fill()}if(dt>=0&&dt<1.5)glow(0,-14,34,'rgba(255,150,255,.8)',1-dt/1.5)}
 else if(k==='leaf'){if(dt>=0){o.t+=0;o.x+=o.vx*.03;o.y+=o.vy*.03;o.rot+=.2;o.vy+=.5;if(o.y>H+30||o.t>4){o.x=W*(.1+R()*.8);o.y=H*(.35+R()*.4);o.hx=o.x;o.t=-1;o.rot=0;o.vx=o.vy=0}}else{o.y+=Math.sin(t+o.ph)*.15;o.x+=Math.cos(t*.7+o.ph)*.2}x=o.x;y=o.y;ctx.translate(x,y);ctx.rotate(o.rot+Math.sin(t+o.ph)*.4);ctx.fillStyle='#7ccf4a';ctx.beginPath();ctx.ellipse(0,0,13,6,0,0,TAU);ctx.fill();ctx.strokeStyle='#3a7d2a';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.stroke()}
 else if(k==='flower'){const b=dt>=0?Math.min(1,dt/.6):0,sc=o.s*(1+.5*Math.sin(b*Math.PI*.5)),sw=Math.sin(t*1.4+o.ph)*5;ctx.translate(x,y);ctx.strokeStyle='#2f8f3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,40);ctx.quadraticCurveTo(sw*.5,20,sw,0);ctx.stroke();ctx.translate(sw,0);ctx.scale(sc,sc);ctx.fillStyle=o.col;for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(Math.cos(i*TAU/6)*9,Math.sin(i*TAU/6)*9,7,7,0,0,TAU);ctx.fill()}ctx.fillStyle='#ffb703';ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.fill()}
 else if(k==='butterfly'){if(dt>=0){o.x+=o.vx*.03;o.y+=o.vy*.03;if(o.x>W+40||o.y<-40||o.t>5){o.x=-30;o.y=H*(.35+R()*.3);o.vx=o.vy=0;o.t=-1}}else{o.x+=Math.sin(t*.5+o.ph)*.5+.15;o.y+=Math.cos(t*.8+o.ph)*.35;if(o.x>W+30)o.x=-30}x=o.x;y=o.y;const f=Math.abs(Math.sin(t*9+o.ph));ctx.translate(x,y);ctx.fillStyle='#ff7ac8';for(const sd of[-1,1]){ctx.beginPath();ctx.ellipse(sd*8*f,-3,9*f+1,12,sd*.3,0,TAU);ctx.fill()}ctx.fillStyle='#4a2a5a';ctx.fillRect(-1.5,-9,3,18)}
 else if(k==='pollen'){y-=((t*10+o.ph*20)%60);x+=Math.sin(t+o.ph)*10;o.cx=x;o.cy=y;glow(x,y,11,'rgba(255,240,150,.95)',.8);}
