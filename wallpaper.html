<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAG Interactive Wallpaper</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#050814;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,0);max-width:80vw;text-align:center;color:#fff;font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:10px 16px;border-radius:14px;background:rgba(10,12,30,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,-10px)}
#panel{max-height:70vh;overflow:auto;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:16px;border-radius:20px;background:rgba(12,14,34,.82);backdrop-filter:blur(14px);color:#fff;border:1px solid rgba(255,255,255,.2);display:none;font-size:14px}
#panel.on{display:block}
#panel h4{margin:10px 0 6px;font-weight:500;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13px}
.chip.sel{background:rgba(255,255,255,.9);color:#111}
#panel input{width:46px;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-align:center}
.sch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px}
</style></head><body>
<canvas id="c"></canvas>
<div id="toast"></div>
<script>window.onerror=function(m,u,l){var t=document.getElementById('toast');if(t){t.textContent='ERR: '+m+' @'+l;t.className='on'}};</script>
<div id="panel">
 <h4>Mode</h4><div class="row"><button class="chip" id="mAuto">Auto</button><button class="chip" id="mMan">Manual</button></div>
 <h4>Environment</h4><div class="row" id="themes"></div>
 <h4>Schedule (hour 0–23)</h4><div class="sch" id="sch"></div>
 <div class="row" style="margin-top:12px"><button class="chip" id="resume">Resume Auto</button><button class="chip" id="close">Close</button></div>
</div>
<script>
(function(){
const md=(a,b)=>a-b*Math.floor(a/b);const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const R=Math.random,TAU=Math.PI*2;
const T={
 forest:{n:'Forest',sky:['#10331f','#3f7a3a','#e9c46a'],pc:['#ffe9a8','#fff7d1','#b8f27b']},
 meadow:{n:'Meadow',sky:['#4aa8ff','#9ad7ff','#d9f5c4'],pc:['#fff3b0','#ffc2d9','#ffffff']},
 beach:{n:'Beach',sky:['#6b4fa0','#ff8f6b','#ffd29a'],pc:['#ffffff','#bfefff','#ffe3a8']},
 space:{n:'Space',sky:['#02030c','#0b1236','#2a1a5e'],pc:['#ffffff','#b9a8ff','#8fe7ff']}
};
/* ===== THEME REGISTRY =====
 To add a festival: 1) T.<key> (name, sky, particle colours)  2) SCENE.<key>(t)  3) LAYOUT.<key>  4) add key to SPECIAL  5) optional date window in FESTIVALS */
const BASE=['forest','meadow','beach','space'],SPECIAL=['birthday','diwali','ganesh_chaturthi'],ORDER=BASE.concat(SPECIAL);
const BIRTH={year:2000,month:2,day:26}; /* EDIT: your birth date. The year is a placeholder. */
const FESTIVALS=[{k:'ganesh_chaturthi',from:'2026-09-13',to:'2026-09-15'},{k:'diwali',from:'2026-11-07',to:'2026-11-09'}]; /* EDIT dates each year (YYYY-MM-DD) */
T.birthday={n:'Birthday',sky:['#2b1055','#7b4fbf','#ffb3c7'],pc:['#ff6f91','#ffd166','#7ae7ff','#c77dff']};
T.diwali={n:'Diwali',sky:['#0b0618','#3a0f4a','#b8421c'],pc:['#ffd34d','#ff9f1c','#ff6f91','#fff1c4']};
T.ganesh_chaturthi={n:'Ganesh Chaturthi',sky:['#ff8a3d','#ffc371','#fff1c9'],pc:['#ff8c00','#ffc107','#ff7aa8','#fff1c4']};
let sch={forest:6,meadow:11,beach:16,space:19},mode='auto',manual='forest';
try{const s=JSON.parse(localStorage.getItem('aag')||'{}');if(s.sch)sch=s.sch;if(s.mode)mode=s.mode;if(s.manual)manual=s.manual}catch(e){}
function save(){try{localStorage.setItem('aag',JSON.stringify({sch,mode,manual}))}catch(e){}}
function special(){const n=new Date();if(n.getMonth()+1===BIRTH.month&&n.getDate()===BIRTH.day)return 'birthday';const d=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);for(const f of FESTIVALS)if(d>=f.from&&d<=f.to)return f.k;return null}
function autoTheme(h){const sp=special();if(sp)return sp;if(h>=sch.space||h<sch.forest)return 'space';if(h>=sch.beach)return 'beach';if(h>=sch.meadow)return 'meadow';return 'forest'}
if(!T[manual])manual='forest';let cur=mode==='auto'?autoTheme(new Date().getHours()):manual,prev=null,fade=1;
function setTheme(n){if(n===cur)return;prev=cur;cur=n;fade=0}
/* objects */
let objs={};
function mk(k,x,y,extra){return Object.assign({k,x,y,hx:x,hy:y,ph:R()*TAU,t:-1,s:.8+R()*.5,vx:0,vy:0,rot:0},extra||{})}
function layout(){
 const w=W,h=H,y=(a,b)=>h*(a+R()*(b-a)),x=()=>w*(.08+R()*.84);
 objs.forest=[];for(let i=0;i<7;i++)objs.forest.push(mk('firefly',x(),y(.3,.85)));
 for(let i=0;i<3;i++)objs.forest.push(mk('mushroom',w*(.15+i*.35+R()*.1),h*(.86+R()*.05)));
 for(let i=0;i<4;i++)objs.forest.push(mk('leaf',x(),y(.35,.8)));
 objs.meadow=[];for(let i=0;i<6;i++)objs.meadow.push(mk('flower',w*(.1+i*.15),h*(.8+R()*.12),{col:['#ff6f91','#ffd166','#c77dff','#ffffff','#ff9f1c'][md(i,5)]}));
 for(let i=0;i<3;i++)objs.meadow.push(mk('butterfly',x(),y(.32,.7)));
 for(let i=0;i<6;i++)objs.meadow.push(mk('pollen',x(),y(.3,.8)));
 objs.beach=[];for(let i=0;i<3;i++)objs.beach.push(mk('shell',x(),h*(.82+R()*.12)));
 for(let i=0;i<2;i++)objs.beach.push(mk('crab',x(),h*(.88+R()*.06)));
 for(let i=0;i<5;i++)objs.beach.push(mk('bubble',x(),y(.55,.8)));
 for(const k of SPECIAL)objs[k]=LAYOUT[k](w,h,y,x);
 objs.space=[];for(let i=0;i<10;i++)objs.space.push(mk('star',x(),y(.3,.9)));
 objs.space.push(mk('planet',w*.78,h*.58,{r:w*.11,col:['#ff9a62','#c24d2c'],ring:1}));
 objs.space.push(mk('planet',w*.2,h*.76,{r:w*.07,col:['#7fd7ff','#2b6cb0'],ring:0}));objs.space.push(mk('planet',w*.62,h*.92,{r:w*.04,col:['#e6d3ff','#7a5ac0'],ring:0}));objs.space.push(mk('astro',w*.5,h*.64,{s:1.3}));
}
const cake=()=>{const h1=H*.07,h2=H*.06,h3=H*.05,ty=H*.8,y1=ty-h1,y2=y1-h2;return{cx:W/2,ty,w1:W*.62,w2:W*.44,w3:W*.28,h1,h2,h3,y1,y2,y3:y2-h3}};
const LAYOUT={
 birthday(w,h,y,x){const g=cake(),a=[],bc=['#ff6f91','#ffd166','#7ae7ff','#c77dff'];[-.3,0,.3].forEach(d=>a.push(mk('candle',g.cx+d*g.w3,g.y3-36)));for(let i=0;i<4;i++)a.push(mk('balloon',x(),y(.4,.9),{col:bc[i]}));a.push(mk('gift',w*.13,g.ty-16,{col:'#ff6f91'}),mk('gift',w*.87,g.ty-16,{col:'#7ae7ff'}));return a},
 diwali(w,h,y,x){const a=[];for(let i=0;i<6;i++)a.push(mk('diya',w*(.1+i*.16),h*(.86+md(i,2)*.03)));for(let i=0;i<3;i++)a.push(mk('lantern',w*(.2+i*.3),h*(.3+i*.05),{hx:w*(.2+i*.3),col:['#ff6f91','#ff9f1c','#ffd34d'][i]}));['#ff6f91','#ffd34d','#7ae7ff','#c77dff'].forEach(c=>a.push(mk('firework',x(),y(.25,.55),{col:c})));return a},
 ganesh_chaturthi(w,h,y,x){const a=[];for(let i=0;i<6;i++)a.push(mk('flower',w*(.1+i*.15),h*(.8+R()*.1),{col:['#ff8c00','#ffc107','#ff6b00'][md(i,3)]}));for(let i=0;i<3;i++)a.push(mk('modak',x(),y(.5,.72)));a.push(mk('diya',w*.14,h*.7),mk('diya',w*.86,h*.7));return a}
};
function resize(){W=innerWidth||screen.width;H=innerHeight||screen.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();bg={};}
/* particles */
let P=[],ripples=[],trail=[];
function emit(x,y,n,sp,th,opt){const pc=T[th||cur].pc;for(let i=0;i<n&&P.length<420;i++){const a=R()*TAU,v=R()*sp;P.push(Object.assign({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0,m:.7+R()*.9,c:pc[(R()*pc.length)|0],s:1+R()*2.4},opt))}}
/* messages */
let toastT=0;const toast=document.getElementById('toast');
function say(txt,f){const now=performance.now();if(!f&&now-toastT<1800)return;toastT=now;toast.textContent=txt;toast.classList.add('on');clearTimeout(say.h);say.h=setTimeout(()=>toast.classList.remove('on'),2300)}
const MSGS=['404: PATIENCE NOT FOUND','MAIN CHARACTER ENERGY: ON','SOMEDAY IS NOT A DAY OF THE WEEK','STILL HERE. STILL TRYING.','PLOT TWIST: IT WORKS OUT','OVERTHINKING IN PROGRESS...','RUNNING ON VIBES AND HOPE','DO NOT DISTURB: GENIUS AT WORK','BRAIN BUFFERING... TRY AGAIN','GOOD DAY FOR GOOD NEWS','ONE STEP AT A TIME','YOU HAVE SURVIVED 100'+String.fromCharCode(37)+' OF HARD DAYS','SMALL PROGRESS COUNTS','LOCK IN. KEEP MOVING.','START WHERE YOU ARE','FUTURE YOU WILL THANK YOU','ACTION CURES DOUBT','TRUST THE PROCESS','DO IT SCARED','KEEP GOING \u2014 YOU\u2019RE CLOSER','DISCIPLINE OVER MOOD','BIG ENERGY TODAY','TAKE A DEEP BREATH','YOU\u2019RE DOING BETTER THAN YOU THINK','NO RUSH. JUST FOCUS.','HAPPY BIRTHDAY, AAG!'];
const BDAY_MSGS=['HAPPY BIRTHDAY, AAG!','LEVEL UP: NEW AGE UNLOCKED','CAKE STATUS: LOADING...','BIRTHDAY MODE: ENABLED','TODAY YOU ARE THE MAIN CHARACTER','ANOTHER LAP AROUND THE SUN: DONE','HAPPY BIRTHDAY, AAG!'];
const WISHES=['MAKE A WISH \u2014 NO SPOILERS!','CLOSE YOUR EYES AND MAKE A WISH','WISH SENT TO THE UNIVERSE','WISH RECEIVED. PROCESSING...'];
function pick(a){return a[(R()*a.length)|0]}
function bstats(){const n=new Date(),b=new Date(BIRTH.year,BIRTH.month-1,BIRTH.day),hrs=Math.floor((n-b)/36e5),f=v=>v.toLocaleString('en-US');return ['YOU ARE '+(n.getFullYear()-BIRTH.year)+' YEARS OLDER TODAY','YOU HAVE SURVIVED '+f(hrs)+' HOURS','THAT IS '+f(Math.floor(hrs/24))+' DAYS OF BEING YOU','ABOUT '+f(hrs*60*72)+' HEARTBEATS SO FAR']}
function msg(){say(pick(cur==='birthday'?bstats().concat(BDAY_MSGS):MSGS))}
/* tap reactions */
function react(o){
 o.t=0;emit(o.x,o.y,18,90);
 if(o.k==='leaf'){o.vy=-60;o.vx=40*(R()-.5)}
 if(o.k==='butterfly'){o.vx=160;o.vy=-140}
 if(o.k==='crab'){o.vx=(R()<.5?-1:1)*90}
 if(o.k==='bubble'||o.k==='shell'||o.k==='planet')ripples.push({x:o.x,y:o.y,r:6,a:1,c:'#ffffff'});
 if(o.k==='candle'){emit(o.x,o.y-4,26,80,cur,{c:'#ffd34d'});say(pick(WISHES),1)}else if(R()<.75)msg();if(o.k==='firework')emit(o.x,o.y,70,220);if(o.k==='balloon')ripples.push({x:o.x,y:o.y,r:6,a:1,c:'#ffffff'});
}
/* background gradient cache */
let bg={};
function grad(n){const s=T[n].sky,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,s[0]);g.addColorStop(.55,s[1]);g.addColorStop(1,s[2]);return g}
function scene(n,a,t){
 ctx.globalAlpha=a;
 ctx.fillStyle=bg[n]||(bg[n]=grad(n));ctx.fillRect(0,0,W,H);
 const f=SCENE[n];f(t);
 for(const o of objs[n])drawObj(o,t,n);
 ctx.globalAlpha=1;
}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(255,255,255,0)');const pa=ctx.globalAlpha;ctx.globalAlpha=pa*a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=pa}
function hill(y,amp,c,t,sw){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=12)ctx.lineTo(x,y+Math.sin(x*sw+t*.0)*amp);ctx.lineTo(W,H);ctx.fill()}
function tree(x,base,h,w,t){ctx.fillStyle='#1d140c';ctx.fillRect(x-w/2,base-h,w,h);ctx.strokeStyle='#1d140c';ctx.lineWidth=w*.35;ctx.beginPath();ctx.moveTo(x,base-h*.5);ctx.lineTo(x-w*1.4,base-h*.8);ctx.moveTo(x,base-h*.35);ctx.lineTo(x+w*1.5,base-h*.65);ctx.moveTo(x-w/2,base);ctx.lineTo(x-w*1.2,base+2);ctx.moveTo(x+w/2,base);ctx.lineTo(x+w*1.2,base+2);ctx.stroke();const sw=Math.sin(t*.8+x)*4;
 for(const [dx,dy,r,c] of [[0,-h*1.1,w*2.6,'#17481f'],[-w*1.6,-h*.85,w*2,'#1f5a2b'],[w*1.7,-h*.88,w*1.9,'#1f5a2b'],[-w*.8,-h*1.02,w*1.9,'#2b7a38'],[w*.9,-h*1.05,w*1.8,'#2f8a3d'],[0,-h*1.28,w*1.5,'#3a9a47'],[-w*1.9,-h*.65,w*1.2,'#2f8a3d'],[w*2,-h*.68,w*1.1,'#3a9a47']]){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+dx+sw,base+dy,r,0,TAU);ctx.fill()}}
const SCENE={
 birthday(t){glow(W*.5,H*.55,W*.75,'rgba(255,200,230,.35)',1);const g=cake();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.beginPath();for(let x=0;x<=W;x+=10){const y=H*.05+Math.sin(x/W*Math.PI)*H*.035;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();for(let i=0;i<9;i++){const x=W*(i+.5)/9,y=H*.05+Math.sin(x/W*Math.PI)*H*.035;ctx.fillStyle=['#ff6f91','#ffd166','#7ae7ff','#c77dff'][md(i,4)];ctx.beginPath();ctx.moveTo(x-9,y);ctx.lineTo(x+9,y);ctx.lineTo(x,y+22+Math.sin(t*2+i)*2);ctx.fill()}ctx.fillStyle='#3d2160';ctx.fillRect(0,g.ty,W,H-g.ty);ctx.fillStyle='#eee';ctx.beginPath();ctx.ellipse(g.cx,g.ty,g.w1*.64,11,0,0,TAU);ctx.fill();for(const [w,h,y,c] of [[g.w1,g.h1,g.y1,'#ff9ec4'],[g.w2,g.h2,g.y2,'#ffd3a6'],[g.w3,g.h3,g.y3,'#c9a7ff']]){ctx.fillStyle=c;ctx.fillRect(g.cx-w/2,y,w,h);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(g.cx-w/2,y-5);ctx.lineTo(g.cx+w/2,y-5);ctx.lineTo(g.cx+w/2,y);for(let i=7;i>=0;i--)ctx.quadraticCurveTo(g.cx-w/2+w*(i+.75)/8,y+13,g.cx-w/2+w*i/8,y);ctx.fill()}},
 diwali(t){for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,230,180,'+(.25+.35*Math.sin(t*2+i))+')';ctx.fillRect(md(i*83.3,W),md(i*57.7,H*.5),1.6,1.6)}glow(W*.5,H*.95,W*.9,'rgba(255,140,40,.45)',1);hill(H*.84,10,'#1a0a24',t,.012);ctx.save();ctx.globalAlpha*=.85;const cx=W/2,cy=H*.93;for(let r=5;r>=1;r--)for(let i=0;i<12;i++){const a=i*TAU/12+r*.2;ctx.fillStyle=['#ff4d6d','#ffd166','#ff9f1c','#7ae7ff','#c77dff'][md(r+i,5)];ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*r*22,cy+Math.sin(a)*r*8,9,5,a,0,TAU);ctx.fill()}ctx.restore()},
 ganesh_chaturthi(t){glow(W*.5,H*.3,W*.8,'rgba(255,240,180,.7)',1);for(let k=0;k<2;k++){const y0=H*(.03+k*.03);for(let i=0;i<=40;i++){const u=i/40,y=y0+Math.sin(u*Math.PI)*H*.06+Math.sin(t*1.5+i)*1.5;ctx.fillStyle=md(i,2)?'#ff8c00':'#ffc107';ctx.beginPath();ctx.arc(u*W,y,5.5,0,TAU);ctx.fill()}}hill(H*.88,8,'#b3412a',t,.012);for(let i=-3;i<=3;i++){ctx.save();ctx.translate(W/2,H*.95);ctx.rotate(i*.28);ctx.fillStyle=md(i,2)?'#ff7aa8':'#ff9fc0';ctx.beginPath();ctx.ellipse(0,-28,13,30,0,0,TAU);ctx.fill();ctx.restore()}},
 forest(t){
  ctx.save();ctx.fillStyle='rgba(255,230,150,.16)';for(let i=0;i<5;i++){const x0=W*(.55+i*.12),sw=Math.sin(t*.4+i)*14;ctx.beginPath();ctx.moveTo(W*.8+i*6,-10);ctx.lineTo(x0-60+sw,H);ctx.lineTo(x0+10+sw,H);ctx.closePath();ctx.fill()}ctx.restore();
  glow(W*.82,0,W*.7,'rgba(255,220,120,.55)',1);
  hill(H*.78,14,'#1c4a2a',t,.01);
  tree(W*.1,H*.9,H*.45,W*.05,t);tree(W*.92,H*.9,H*.4,W*.045,t);tree(W*.5,H*.8,H*.2,W*.025,t);
  hill(H*.9,8,'#12301c',t,.02);ctx.strokeStyle='#2f8a3d';ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<16;i++){const x=i*W/15+md(i*29,20),s=Math.sin(t*1.2+i)*5;for(let j=-1;j<=1;j++){ctx.moveTo(x,H);ctx.quadraticCurveTo(x+j*8,H-24,x+j*22+s,H-44-md(i,3)*8)}}ctx.stroke();
  for(let i=0;i<10;i++){const x=md(i*W/9+t*6,W),y=H*.3+md(i*97+t*14,H*.5);glow(x,y,3,'#ffe9a8',.6)}
 },
 meadow(t){
  glow(W*.8,H*.18,W*.5,'rgba(255,255,220,.9)',1);
  ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<4;i++){const x=md(t*8+i*W*.4,W*1.4)-W*.2,y=H*(.34+i*.07);for(const [dx,r] of [[0,26],[26,34],[56,24]]){ctx.beginPath();ctx.ellipse(x+dx,y,r*1.4,r*.7,0,0,TAU);ctx.fill()}}
  hill(H*.74,18,'#6cc76a',t,.012);hill(H*.82,14,'#4fae52',t,.02);
  ctx.strokeStyle='#2f8f3a';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<W;x+=9){const y=H*.84+md(x*13,40);ctx.moveTo(x,y+30);ctx.lineTo(x+Math.sin(t*1.6+x*.05)*6,y)}ctx.stroke();
 },
 beach(t){
  glow(W*.5,H*.42,W*.8,'rgba(255,200,120,.75)',1);
  ctx.fillStyle='#fff1c4';ctx.beginPath();ctx.arc(W*.5,H*.42,W*.12,0,TAU);ctx.fill();
  const sy=H*.5;let g=ctx.createLinearGradient(0,sy,0,H*.78);g.addColorStop(0,'#ff9d8a');g.addColorStop(1,'#1fb5b5');ctx.fillStyle=g;ctx.fillRect(0,sy,W,H*.3);

 for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=r.r<0?(r.r+=0,3):3;r.a-=.025;if(r.a<=0){ripples.splice(i,1);continue}ctx.globalAlpha=r.a;ctx.strokeStyle=r.c;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,Math.abs(r.r),0,TAU);ctx.stroke()}
 ctx.globalAlpha=1;
}
